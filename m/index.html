<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skins Repo - Kazus</title>
    <link rel="stylesheet" href="../../style.css">
    <script src="https://bs-community.github.io/skinview3d/js/skinview3d.bundle.js"></script>
    <style>
        .category-title {
            font-size: 1.4rem;
            color: var(--accent-amber, #ff9900);
            border-bottom: 2px solid var(--card-border, rgba(255, 100, 0, 0.2));
            padding-bottom: 0.4rem;
            margin: 2.5rem 0 1rem 0;
            text-align: left;
            width: 100%;
            max-width: 1100px;
            text-transform: capitalize;
            text-shadow: 0 0 10px rgba(255, 153, 0, 0.3);
        }

        .skins-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 1.5rem;
        }

        .skin-card {
            background: var(--card-bg, rgba(255, 69, 0, 0.04));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border, rgba(255, 100, 0, 0.15));
            border-radius: 16px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .skin-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-fire, #ff4500);
            box-shadow: 0 10px 25px -5px rgba(255, 69, 0, 0.4);
        }

        .skin-card h3 {
            font-size: 1rem;
            color: var(--text-main, #fff5f0);
            margin-bottom: 0.8rem;
            text-transform: capitalize;
            font-family: 'JetBrains Mono', monospace;
        }

        .canvas-container {
            width: 180px;
            height: 220px;
            margin-bottom: 1rem;
            cursor: grab;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            width: 100%;
        }

        .btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border, rgba(255, 100, 0, 0.15));
            color: var(--text-main, #fff5f0);
            padding: 0.5rem 0.2rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--accent-fire, #ff4500);
            border-color: var(--accent-fire, #ff4500);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
        }

        .btn-secondary:hover {
            background: var(--accent-amber, #ff9900);
            border-color: var(--accent-amber, #ff9900);
        }

        #loading {
            color: var(--accent-amber, #ff9900);
            font-family: 'JetBrains Mono', monospace;
            margin: 2rem 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Catálogo de Skins</h1>
    </header>

    <div id="loading">Cargando categorías y skins...</div>
    <div id="catalog-container"></div>

    <footer>
        <p>Hecho por <strong>Kazus Suzak</strong> &copy;</p>
    </footer>

    <script>
        const USERNAME = 'gtalex1';
        const REPO = 'recursos';
        const BASE_FOLDER = 'm';

        const catalogContainer = document.getElementById('catalog-container');
        const loading = document.getElementById('loading');

        let globalIndex = 0; // Para dar un ID único a cada canvas

        async function fetchDirectory(path) {
            const response = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/${path}`);
            if (!response.ok) return [];
            return await response.json();
        }

        async function initCatalog() {
            try {
                const rootContents = await fetchDirectory(BASE_FOLDER);
                loading.style.display = 'none';

                if (rootContents.length === 0) {
                    loading.textContent = 'No se encontraron archivos en la carpeta.';
                    loading.style.display = 'block';
                    return;
                }

                // Separa los elementos en carpetas (categorías) e imágenes sueltas
                const directories = rootContents.filter(item => item.type === 'dir');
                const rootImages = rootContents.filter(item => item.type === 'file' && item.name.endsWith('.png'));

                // 1. Procesar carpetas como Secciones
                for (const dir of directories) {
                    const dirContents = await fetchDirectory(dir.path);
                    const images = dirContents.filter(item => item.name.endsWith('.png'));

                    if (images.length > 0) {
                        createCategorySection(dir.name, images, dir.path);
                    }
                }

                // 2. Si hay imágenes sueltas en la raíz, ponerlas al final bajo "Otros / General"
                if (rootImages.length > 0) {
                    createCategorySection('General', rootImages, BASE_FOLDER);
                }

            } catch (error) {
                console.error(error);
                loading.textContent = 'Error al cargar el catálogo de skins.';
            }
        }

        function createCategorySection(categoryName, imageFiles, folderPath) {
            // Título de la sección
            const title = document.createElement('h2');
            title.className = 'category-title';
            title.textContent = categoryName;
            catalogContainer.appendChild(title);

            // Grid de la sección
            const grid = document.createElement('div');
            grid.className = 'skins-grid';
            catalogContainer.appendChild(grid);

            // Generar tarjetas para la categoría
            imageFiles.forEach(file => {
                globalIndex++;
                const skinName = file.name.replace('.png', '').replace(/[-_]/g, ' ');
                
                // Construye la ruta relativa local y la URL pública completa
                const relativeUrl = `${folderPath.replace(BASE_FOLDER + '/', '')}/${file.name}`.replace(`${BASE_FOLDER}/`, '');
                const absoluteUrl = `https://${USERNAME}.github.io/${REPO}/${folderPath}/${file.name}`;
                const canvasId = `skin_canvas_${globalIndex}`;

                const card = document.createElement('div');
                card.className = 'skin-card';
                card.innerHTML = `
                    <h3>${skinName}</h3>
                    <div class="canvas-container">
                        <canvas id="${canvasId}"></canvas>
                    </div>
                    <div class="btn-group">
                        <button class="btn" onclick="copyToClipboard('${absoluteUrl}', this)">Copiar URL</button>
                        <a class="btn btn-secondary" href="${relativeUrl}" download="${file.name}">Descargar</a>
                    </div>
                `;
                grid.appendChild(card);

                // Inicializar visor 3D
                const viewer = new skinview3d.SkinViewer({
                    canvas: document.getElementById(canvasId),
                    width: 180,
                    height: 220,
                    skin: relativeUrl
                });

                viewer.animation = new skinview3d.WalkingAnimation();
                viewer.animation.speed = 0.5;
                viewer.autoRotate = true;
                viewer.autoRotateSpeed = 0.8;
            });
        }

        function copyToClipboard(url, btnElement) {
            navigator.clipboard.writeText(url).then(() => {
                const originalText = btnElement.textContent;
                btnElement.textContent = '¡Copiado!';
                btnElement.style.background = 'var(--accent-amber, #ff9900)';
                
                setTimeout(() => {
                    btnElement.textContent = originalText;
                    btnElement.style.background = '';
                }, 1800);
            });
        }

        initCatalog();
    </script>
</body>
</html>
