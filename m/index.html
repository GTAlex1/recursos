<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skins Repo - Kazus</title>
    <link rel="stylesheet" href="../../style.css">
    <script src="https://bs-community.github.io/skinview3d/js/skinview3d.bundle.js"></script>
    <style>
        .category-title {
            font-size: 1.4rem;
            color: var(--accent-amber, #ff9900);
            border-bottom: 2px solid var(--card-border, rgba(255, 100, 0, 0.2));
            padding-bottom: 0.4rem;
            margin: 2.5rem 0 1rem 0;
            text-align: left;
            width: 100%;
            max-width: 1100px;
            text-transform: capitalize;
            text-shadow: 0 0 10px rgba(255, 153, 0, 0.3);
        }

        .skins-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 1.5rem;
        }

        .skin-card {
            background: var(--card-bg, rgba(255, 69, 0, 0.04));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border, rgba(255, 100, 0, 0.15));
            border-radius: 16px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .skin-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-fire, #ff4500);
            box-shadow: 0 10px 25px -5px rgba(255, 69, 0, 0.4);
        }

        .skin-card h3 {
            font-size: 1rem;
            color: var(--text-main, #fff5f0);
            margin-bottom: 0.8rem;
            text-transform: capitalize;
            font-family: 'JetBrains Mono', monospace;
        }

        .canvas-container {
            width: 180px;
            height: 220px;
            margin-bottom: 1rem;
            cursor: grab;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            width: 100%;
        }

        .btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border, rgba(255, 100, 0, 0.15));
            color: var(--text-main, #fff5f0);
            padding: 0.5rem 0.2rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--accent-fire, #ff4500);
            border-color: var(--accent-fire, #ff4500);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
        }

        .btn-secondary:hover {
            background: var(--accent-amber, #ff9900);
            border-color: var(--accent-amber, #ff9900);
        }

        #loading {
            color: var(--accent-amber, #ff9900);
            font-family: 'JetBrains Mono', monospace;
            margin: 2rem 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Catálogo de Skins</h1>
    </header>

    <div id="loading">Cargando categorías y skins...</div>
    <div id="catalog-container"></div>

    <footer>
        <p>Hecho por <strong>Kazus Suzak</strong> &copy;</p>
    </footer>

    <script>
        const USERNAME = 'gtalex1';
const REPO = 'recursos';
const BASE_FOLDER = 'm';

const catalogContainer = document.getElementById('catalog-container');
const loading = document.getElementById('loading');

let globalIndex = 0;

// Función para consultar la API de GitHub
async function fetchDirectory(path) {
    try {
        const response = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/${path}`);
        if (!response.ok) return [];
        return await response.json();
    } catch (e) {
        console.error("Error leyendo directorio:", path, e);
        return [];
    }
}

// Función RECURSIVA para buscar todas las imágenes PNG sin importar la profundidad
async function scanFolderRecursively(path) {
    const contents = await fetchDirectory(path);
    let pngFiles = [];

    for (const item of contents) {
        if (item.type === 'file' && item.name.toLowerCase().endsWith('.png')) {
            pngFiles.push(item);
        } else if (item.type === 'dir') {
            // Si es una carpeta, entrar y buscar dentro de ella
            const subFiles = await scanFolderRecursively(item.path);
            pngFiles = pngFiles.concat(subFiles);
        }
    }

    return pngFiles;
}

async function initCatalog() {
    try {
        const rootContents = await fetchDirectory(BASE_FOLDER);
        if (loading) loading.style.display = 'none';

        // Detectar carpetas principales (ej: Animes, Juegos)
        const mainCategories = rootContents.filter(item => item.type === 'dir');

        for (const categoryDir of mainCategories) {
            // Escanear recursivamente todos los PNG dentro de esta categoría
            const allSkins = await scanFolderRecursively(categoryDir.path);

            if (allSkins.length > 0) {
                renderCategoryGroup(categoryDir.name, allSkins);
            }
        }

    } catch (error) {
        console.error(error);
        if (loading) loading.textContent = 'Error al cargar el catálogo de skins.';
    }
}

function renderCategoryGroup(categoryName, imageFiles) {
    const mainTitle = document.createElement('h2');
    mainTitle.className = 'category-title';
    mainTitle.textContent = categoryName;
    catalogContainer.appendChild(mainTitle);

    const grid = document.createElement('div');
    grid.className = 'skins-grid';
    catalogContainer.appendChild(grid);

    imageFiles.forEach(file => {
        globalIndex++;
        const skinName = file.name.replace(/\.png$/i, '').replace(/[-_]/g, ' ');
        const rawUrl = file.download_url;
        const canvasId = `skin_canvas_${globalIndex}`;
        const selectId = `cmd_type_${globalIndex}`;
        const btnId = `btn_copy_${globalIndex}`;

        const pathLower = file.path.toLowerCase();
        const isSlim = pathLower.includes('chica') || pathLower.includes('slim') || pathLower.includes('alex');
        const modelType = isSlim ? 'slim' : 'classic';

        const pathParts = file.path.split('/');
        const subCat = pathParts.length > 3 ? pathParts[2] : '';

        const card = document.createElement('div');
        card.className = 'skin-card';
        card.innerHTML = `
            <h3>${skinName}</h3>
            ${subCat ? `<span style="font-size: 0.75rem; color: var(--accent-amber); margin-top: -0.4rem; margin-bottom: 0.5rem;">${subCat} (${modelType})</span>` : ''}
            
            <div class="canvas-container">
                <canvas id="${canvasId}"></canvas>
            </div>
            
            <!-- Desplegable con listener para cambiar el texto del botón -->
            <select id="${selectId}" class="btn" style="margin-bottom: 0.5rem; text-align: center;" onchange="updateButtonText('${selectId}', '${btnId}')">
                <option value="plugin">Plugin (/skin url)</option>
                <option value="mod">Mod (/skin set web)</option>
                <option value="raw">Solo URL de la imagen</option>
            </select>

            <div class="btn-group">
                <button id="${btnId}" class="btn" onclick="copyCustomCommand('${rawUrl}', '${selectId}', '${modelType}', this)">Copiar Comando</button>
                <a class="btn btn-secondary" href="${rawUrl}" download="${file.name}">Descargar</a>
            </div>
        `;
        grid.appendChild(card);

        // Renderizado 3D de la skin
        try {
            const viewer = new skinview3d.SkinViewer({
                canvas: document.getElementById(canvasId),
                width: 180,
                height: 220,
                skin: rawUrl,
                model: modelType
            });
            viewer.animation = new skinview3d.WalkingAnimation();
            viewer.animation.speed = 0.5;
            viewer.autoRotate = true;
            viewer.autoRotateSpeed = 0.8;
        } catch (e) {
            console.error("Error en el visor 3D para " + file.name, e);
        }
    });
}

// Cambia el texto del botón dinámicamente según la opción elegida
function updateButtonText(selectId, btnId) {
    const select = document.getElementById(selectId);
    const btn = document.getElementById(btnId);

    if (select.value === 'raw') {
        btn.textContent = 'Copiar URL';
    } else {
        btn.textContent = 'Copiar Comando';
    }
}

// Copia el texto adecuado e informa al usuario
function copyCustomCommand(url, selectId, modelType, btnElement) {
    const mode = document.getElementById(selectId).value;
    let textToCopy = url;
    let successMsg = '¡URL copiada!';

    if (mode === 'plugin') {
        textToCopy = `/skin url ${url}`;
        successMsg = '¡Comando copiado!';
    } else if (mode === 'mod') {
        textToCopy = `/skin set web ${modelType} "${url}"`;
        successMsg = '¡Comando copiado!';
    }

    navigator.clipboard.writeText(textToCopy).then(() => {
        const originalText = btnElement.textContent;
        btnElement.textContent = successMsg;
        btnElement.style.background = 'var(--accent-amber, #ff9900)';
        
        setTimeout(() => {
            btnElement.textContent = originalText;
            btnElement.style.background = '';
        }, 1800);
    });
}

// Inicializar el catálogo
initCatalog();
    </script>
</body>
</html>
