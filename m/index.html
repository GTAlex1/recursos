<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skins Repo - Kazus</title>
    <!-- Carga la hoja de estilo usando la ruta relativa o absoluta -->
    <link rel="stylesheet" href="../../style.css">
    <script src="https://bs-community.github.io/skinview3d/js/skinview3d.bundle.js"></script>
    <style>
        .skins-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
            margin-top: 1rem;
        }

        .skin-card {
            background: var(--card-bg, rgba(255, 69, 0, 0.04));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border, rgba(255, 100, 0, 0.15));
            border-radius: 16px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .skin-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-fire, #ff4500);
            box-shadow: 0 10px 25px -5px rgba(255, 69, 0, 0.4);
        }

        .skin-card h3 {
            font-size: 1rem;
            color: var(--text-main, #fff5f0);
            margin-bottom: 0.8rem;
            text-transform: capitalize;
            font-family: 'JetBrains Mono', monospace;
        }

        .canvas-container {
            width: 180px;
            height: 220px;
            margin-bottom: 1rem;
            cursor: grab;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            width: 100%;
        }

        .btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border, rgba(255, 100, 0, 0.15));
            color: var(--text-main, #fff5f0);
            padding: 0.5rem 0.2rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--accent-fire, #ff4500);
            border-color: var(--accent-fire, #ff4500);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
        }

        .btn-secondary:hover {
            background: var(--accent-amber, #ff9900);
            border-color: var(--accent-amber, #ff9900);
        }

        #loading {
            color: var(--accent-amber, #ff9900);
            font-family: 'JetBrains Mono', monospace;
            margin: 2rem 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Catálogo de Skins</h1>
    </header>
    <h2>Minecraft Repository</h2>

    <div id="loading">Cargando skins...</div>
    <div id="skins-container" class="skins-grid"></div>

    <footer>
        <p>Hecho por <strong>Kazus Suzak</strong> &copy;</p>
    </footer>

    <script>
        const USERNAME = 'gtalex1';
        const REPO = 'recursos'; // Tu repositorio de recursos
        const FOLDER_PATH = 'm';  // Carpeta 'm' dentro del repositorio

        const container = document.getElementById('skins-container');
        const loading = document.getElementById('loading');

        async function fetchSkins() {
            try {
                // Petición a la API de GitHub apuntando directamente a la carpeta m
                const response = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FOLDER_PATH}`);
                
                if (!response.ok) throw new Error('No se pudo acceder a las skins');

                const files = await response.json();
                loading.style.display = 'none';

                // Filtra solo los archivos .png que están en la misma carpeta
                const skinFiles = files.filter(file => file.name.endsWith('.png'));

                if (skinFiles.length === 0) {
                    loading.textContent = 'No se encontraron skins PNG en esta carpeta.';
                    loading.style.display = 'block';
                    return;
                }

                skinFiles.forEach((file, index) => {
                    const skinName = file.name.replace('.png', '').replace(/[-_]/g, ' ');
                    
                    // Al estar en la misma carpeta, la URL relativa es simplemente el nombre de la imagen
                    const relativeUrl = file.name; 
                    // URL completa para el botón de copiar
                    const absoluteUrl = `https://${USERNAME}.github.io/${REPO}/${FOLDER_PATH}/${file.name}`;
                    
                    const canvasId = `skin_canvas_${index}`;

                    const card = document.createElement('div');
                    card.className = 'skin-card';
                    card.innerHTML = `
                        <h3>${skinName}</h3>
                        <div class="canvas-container">
                            <canvas id="${canvasId}"></canvas>
                        </div>
                        <div class="btn-group">
                            <button class="btn" onclick="copyToClipboard('${absoluteUrl}', this)">Copiar URL</button>
                            <a class="btn btn-secondary" href="${relativeUrl}" download="${file.name}">Descargar</a>
                        </div>
                    `;
                    container.appendChild(card);

                    // Carga el visor 3D pasándole la imagen de la misma carpeta
                    const viewer = new skinview3d.SkinViewer({
                        canvas: document.getElementById(canvasId),
                        width: 180,
                        height: 220,
                        skin: relativeUrl
                    });

                    viewer.animation = new skinview3d.WalkingAnimation();
                    viewer.animation.speed = 0.5;
                    viewer.autoRotate = true;
                    viewer.autoRotateSpeed = 0.8;
                });

            } catch (error) {
                console.error(error);
                loading.textContent = 'Error al cargar las skins.';
            }
        }

        function copyToClipboard(url, btnElement) {
            navigator.clipboard.writeText(url).then(() => {
                const originalText = btnElement.textContent;
                btnElement.textContent = '¡Copiado!';
                btnElement.style.background = 'var(--accent-amber, #ff9900)';
                
                setTimeout(() => {
                    btnElement.textContent = originalText;
                    btnElement.style.background = '';
                }, 1800);
            });
        }

        fetchSkins();
    </script>
</body>
</html>
