<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skins Repo - Kazus</title>
    <link rel="stylesheet" href="../../style.css">
    <script src="https://bs-community.github.io/skinview3d/js/skinview3d.bundle.js"></script>
    <style>
        .category-title {
            font-size: 1.4rem;
            color: var(--accent-amber, #ff9900);
            border-bottom: 2px solid var(--card-border, rgba(255, 100, 0, 0.2));
            padding-bottom: 0.4rem;
            margin: 2.5rem 0 1rem 0;
            text-align: left;
            width: 100%;
            max-width: 1100px;
            text-transform: capitalize;
            text-shadow: 0 0 10px rgba(255, 153, 0, 0.3);
        }

        .skins-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 1.5rem;
        }

        .skin-card {
            background: var(--card-bg, rgba(255, 69, 0, 0.04));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border, rgba(255, 100, 0, 0.15));
            border-radius: 16px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .skin-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-fire, #ff4500);
            box-shadow: 0 10px 25px -5px rgba(255, 69, 0, 0.4);
        }

        .skin-card h3 {
            font-size: 1rem;
            color: var(--text-main, #fff5f0);
            margin-bottom: 0.8rem;
            text-transform: capitalize;
            font-family: 'JetBrains Mono', monospace;
        }

        .canvas-container {
            width: 180px;
            height: 220px;
            margin-bottom: 1rem;
            cursor: grab;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            width: 100%;
        }

        .btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border, rgba(255, 100, 0, 0.15));
            color: var(--text-main, #fff5f0);
            padding: 0.5rem 0.2rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--accent-fire, #ff4500);
            border-color: var(--accent-fire, #ff4500);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
        }

        .btn-secondary:hover {
            background: var(--accent-amber, #ff9900);
            border-color: var(--accent-amber, #ff9900);
        }

        #loading {
            color: var(--accent-amber, #ff9900);
            font-family: 'JetBrains Mono', monospace;
            margin: 2rem 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Catálogo de Skins</h1>
    </header>

    <div id="loading">Cargando categorías y skins...</div>
    <div id="catalog-container"></div>

    <footer>
        <p>Hecho por <strong>Kazus Suzak</strong> &copy;</p>
    </footer>

    <script>
        const USERNAME = 'gtalex1';
const REPO = 'recursos';
const BASE_FOLDER = 'm';

const catalogContainer = document.getElementById('catalog-container');
const loading = document.getElementById('loading');

let globalIndex = 0;

async function initCatalog() {
    try {
        // 1. Pedir el árbol completo del repositorio en UNA SOLA petición (evita bloqueo de la API)
        const response = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/main?recursive=1`);
        
        if (!response.ok) {
            // Intentar con rama 'master' si 'main' diera error
            const fallbackResponse = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/master?recursive=1`);
            if (!fallbackResponse.ok) throw new Error('Error accediendo a la API de GitHub');
            var data = await fallbackResponse.json();
        } else {
            var data = await response.json();
        }

        if (loading) loading.style.display = 'none';

        // 2. Filtrar solo los archivos .png dentro de la carpeta 'm/'
        const allSkins = data.tree.filter(item => 
            item.type === 'blob' && 
            item.path.startsWith(`${BASE_FOLDER}/`) && 
            item.path.toLowerCase().endsWith('.png')
        );

        if (allSkins.length === 0) {
            if (loading) {
                loading.textContent = 'No se encontraron skins PNG en la carpeta.';
                loading.style.display = 'block';
            }
            return;
        }

        // 3. Agrupar las skins por Gran Categoría (el primer nivel dentro de 'm/', ej: Animes, Juegos)
        const categories = {};

        allSkins.forEach(file => {
            const relativePath = file.path.replace(`${BASE_FOLDER}/`, '');
            const parts = relativePath.split('/');
            
            // Si está dentro de una carpeta (ej: Animes/...), esa es la categoría principal.
            // Si está suelta en m/, va a "General".
            const mainCategory = parts.length > 1 ? parts[0] : 'General';

            if (!categories[mainCategory]) {
                categories[mainCategory] = [];
            }
            categories[mainCategory].push(file);
        });

        // 4. Renderizar cada Gran Categoría (Animes, Juegos, etc.)
        for (const [categoryName, files] of Object.entries(categories)) {
            renderCategoryGroup(categoryName, files);
        }

    } catch (error) {
        console.error(error);
        if (loading) {
            loading.textContent = 'Error de API o límite de peticiones superado. Reintenta en unos minutos.';
            loading.style.display = 'block';
        }
    }
}

function renderCategoryGroup(categoryName, imageFiles) {
    // Título de la categoría principal (Animes, Juegos, etc.)
    const mainTitle = document.createElement('h2');
    mainTitle.className = 'category-title';
    mainTitle.textContent = categoryName;
    catalogContainer.appendChild(mainTitle);

    const grid = document.createElement('div');
    grid.className = 'skins-grid';
    catalogContainer.appendChild(grid);

    imageFiles.forEach(file => {
        globalIndex++;
        
        // Extraer el nombre de la skin sin extensión
        const pathParts = file.path.split('/');
        const fileName = pathParts[pathParts.length - 1];
        const skinName = fileName.replace(/\.png$/i, '').replace(/[-_]/g, ' ');

        // Determinar subcategoría (obra/juego, ej: "Darling in the FranXX")
        const subCat = pathParts.length > 3 ? pathParts[pathParts.length - 3] : (pathParts.length > 2 ? pathParts[1] : '');

        // Generar la URL RAW directa de descarga/visor
        const rawUrl = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/main/${file.path}`;
        const publicUrl = `https://${USERNAME}.github.io/${REPO}/${file.path}`;

        // Detectar si es modelo Slim (Chica/Alex) o Classic (Chico/Steve)
        const pathLower = file.path.toLowerCase();
        const isSlim = pathLower.includes('chica') || pathLower.includes('slim') || pathLower.includes('alex');
        const modelType = isSlim ? 'slim' : 'classic';

        const canvasId = `skin_canvas_${globalIndex}`;
        const selectId = `cmd_type_${globalIndex}`;
        const btnId = `copy_btn_${globalIndex}`;

        const card = document.createElement('div');
        card.className = 'skin-card';
        card.innerHTML = `
            <h3>${skinName}</h3>
            ${subCat ? `<span style="font-size: 0.75rem; color: var(--accent-amber); margin-top: -0.4rem; margin-bottom: 0.5rem;">${subCat} (${modelType})</span>` : ''}
            
            <div class="canvas-container">
                <canvas id="${canvasId}"></canvas>
            </div>
            
            <select id="${selectId}" class="btn" style="margin-bottom: 0.5rem; text-align: center;" onchange="updateButtonLabel('${selectId}', '${btnId}')">
                <option value="plugin">Plugin (/skin url)</option>
                <option value="mod">Mod (/skin set web)</option>
                <option value="raw">Solo URL de la imagen</option>
            </select>

            <div class="btn-group">
                <button id="${btnId}" class="btn" onclick="copyCustomCommand('${publicUrl}', '${selectId}', '${modelType}', this)">Copiar Comando</button>
                <a class="btn btn-secondary" href="${rawUrl}" download="${fileName}">Descargar</a>
            </div>
        `;
        grid.appendChild(card);

        // Inicializar el visor 3D
        try {
            const viewer = new skinview3d.SkinViewer({
                canvas: document.getElementById(canvasId),
                width: 180,
                height: 220,
                skin: rawUrl,
                model: modelType
            });
            viewer.animation = new skinview3d.WalkingAnimation();
            viewer.animation.speed = 0.5;
            viewer.autoRotate = true;
            viewer.autoRotateSpeed = 0.8;
        } catch (e) {
            console.error("Error al renderizar skin 3D:", file.path, e);
        }
    });
}

// Cambiar el texto del botón dinámicamente segun la opción elegida
function updateButtonLabel(selectId, btnId) {
    const mode = document.getElementById(selectId).value;
    const btn = document.getElementById(btnId);
    
    if (mode === 'raw') {
        btn.textContent = 'Copiar URL';
    } else {
        btn.textContent = 'Copiar Comando';
    }
}

// Lógica de copiado al portapapeles
function copyCustomCommand(url, selectId, modelType, btnElement) {
    const mode = document.getElementById(selectId).value;
    let textToCopy = url;
    let successMessage = '¡URL copiada!';

    if (mode === 'plugin') {
        textToCopy = `/skin url ${url}`;
        successMessage = '¡Comando copiado!';
    } else if (mode === 'mod') {
        textToCopy = `/skin set web ${modelType} "${url}"`;
        successMessage = '¡Comando copiado!';
    }

    navigator.clipboard.writeText(textToCopy).then(() => {
        const originalText = btnElement.textContent;
        btnElement.textContent = successMessage;
        btnElement.style.background = 'var(--accent-amber, #ff9900)';
        
        setTimeout(() => {
            btnElement.textContent = originalText;
            btnElement.style.background = '';
        }, 1800);
    });
}

// Arrancar la carga optimizada
initCatalog();
    </script>
</body>
</html>
