<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skins Repo - Kazus</title>
    <link rel="stylesheet" href="../../style.css">
    <script src="https://bs-community.github.io/skinview3d/js/skinview3d.bundle.js"></script>
    <style>
        .category-title {
            font-size: 1.4rem;
            color: var(--accent-amber, #ff9900);
            border-bottom: 2px solid var(--card-border, rgba(255, 100, 0, 0.2));
            padding-bottom: 0.4rem;
            margin: 2.5rem 0 1rem 0;
            text-align: left;
            width: 100%;
            max-width: 1100px;
            text-transform: capitalize;
            text-shadow: 0 0 10px rgba(255, 153, 0, 0.3);
        }

        .skins-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 1.5rem;
        }

        .skin-card {
            background: var(--card-bg, rgba(255, 69, 0, 0.04));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border, rgba(255, 100, 0, 0.15));
            border-radius: 16px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .skin-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-fire, #ff4500);
            box-shadow: 0 10px 25px -5px rgba(255, 69, 0, 0.4);
        }

        .skin-card h3 {
            font-size: 1rem;
            color: var(--text-main, #fff5f0);
            margin-bottom: 0.8rem;
            text-transform: capitalize;
            font-family: 'JetBrains Mono', monospace;
        }

        .canvas-container {
            width: 180px;
            height: 220px;
            margin-bottom: 1rem;
            cursor: grab;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            width: 100%;
        }

        .btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border, rgba(255, 100, 0, 0.15));
            color: var(--text-main, #fff5f0);
            padding: 0.5rem 0.2rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--accent-fire, #ff4500);
            border-color: var(--accent-fire, #ff4500);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
        }

        .btn-secondary:hover {
            background: var(--accent-amber, #ff9900);
            border-color: var(--accent-amber, #ff9900);
        }

        #loading {
            color: var(--accent-amber, #ff9900);
            font-family: 'JetBrains Mono', monospace;
            margin: 2rem 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Catálogo de Skins</h1>
    </header>

    <div id="loading">Cargando categorías y skins...</div>
    <div id="catalog-container"></div>

    <footer>
        <p>Hecho por <strong>Kazus Suzak</strong> &copy;</p>
    </footer>

    <script>
        const USERNAME = 'gtalex1';
const REPO = 'recursos';
const BASE_FOLDER = 'm';

const catalogContainer = document.getElementById('catalog-container');
const loading = document.getElementById('loading');

let globalIndex = 0;
const activeViewers = new Map();

async function initCatalog() {
    try {
        const response = await fetch('/recursos/m/skins.json');
        if (!response.ok) throw new Error('No se pudo encontrar m/skins.json');
        
        const allSkins = await response.json();

        if (loading) loading.style.display = 'none';

        if (!allSkins || allSkins.length === 0) {
            if (loading) {
                loading.textContent = 'No hay skins registradas.';
                loading.style.display = 'block';
            }
            return;
        }

        // Estructura anidada: { "Animes": { "Haikyuu!": [...], "Pokemon": [...] } }
        const tree = {};

        allSkins.forEach(file => {
            const relativePath = file.path.replace(`${BASE_FOLDER}/`, '');
            const parts = relativePath.split('/');
            
            const mainCat = parts.length > 1 ? parts[0] : 'General';
            const subCat = parts.length > 2 ? parts[1] : 'Variados';

            if (!tree[mainCat]) tree[mainCat] = {};
            if (!tree[mainCat][subCat]) tree[mainCat][subCat] = [];

            tree[mainCat][subCat].push(file);
        });

        // Renderizado jerárquico
        for (const [mainCat, subCats] of Object.entries(tree)) {
            const mainTitle = document.createElement('h1');
            mainTitle.className = 'main-category-title';
            mainTitle.style.cssText = 'font-size: 2rem; color: #fff; margin-top: 2rem; border-bottom: 2px solid var(--accent-amber, #ff9900); padding-bottom: 0.3rem;';
            mainTitle.textContent = mainCat;
            catalogContainer.appendChild(mainTitle);

            for (const [subCat, files] of Object.entries(subCats)) {
                renderSubCategoryGroup(subCat, files);
            }
        }

        setupIntersectionObserver();

    } catch (error) {
        console.error(error);
        if (loading) {
            loading.textContent = 'Error al cargar el catálogo de skins.';
            loading.style.display = 'block';
        }
    }
}

function renderSubCategoryGroup(subCategoryName, imageFiles) {
    const subTitle = document.createElement('h3');
    subTitle.className = 'sub-category-title';
    subTitle.style.cssText = 'font-size: 1.3rem; color: var(--accent-amber, #ff9900); margin: 1.5rem 0 0.8rem 0.5rem;';
    subTitle.textContent = subCategoryName;
    catalogContainer.appendChild(subTitle);

    const grid = document.createElement('div');
    grid.className = 'skins-grid';
    catalogContainer.appendChild(grid);

    imageFiles.forEach(file => {
        globalIndex++;
        
        const pathParts = file.path.split('/');
        const fileName = file.name || pathParts[pathParts.length - 1];
        const skinName = fileName.replace(/\.png$/i, '').replace(/[-_]/g, ' ');

        const safePath = file.path.split('/').map(segment => encodeURIComponent(segment)).join('/');
        const rawUrl = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/main/${safePath}`;
        const publicUrl = `https://${USERNAME}.github.io/${REPO}/${safePath}`;

        const pathLower = file.path.toLowerCase();
        const isSlim = pathLower.includes('chica') || pathLower.includes('slim') || pathLower.includes('alex');
        const modelType = isSlim ? 'slim' : 'classic';

        const containerId = `container_${globalIndex}`;
        const dropdownId = `dropdown_${globalIndex}`;

        const card = document.createElement('div');
        card.className = 'skin-card';
        card.innerHTML = `
            <h3>${skinName}</h3>
            <span style="font-size: 0.75rem; color: #888; margin-top: -0.4rem; margin-bottom: 0.5rem;">(${modelType})</span>
            
            <div class="canvas-container" id="${containerId}" data-skin-url="${rawUrl}" data-model="${modelType}"></div>
            
            <div class="btn-group" style="position: relative; margin-top: 0.5rem;">
                <button class="btn" onclick="toggleDropdown('${dropdownId}', event)">Copiar ▼</button>
                <a class="btn btn-secondary" href="${rawUrl}" download="${fileName}">Descargar</a>

                <div id="${dropdownId}" class="copy-dropdown" style="display: none; position: absolute; bottom: 110%; left: 0; width: 100%; background: #1e1e1e; border: 1px solid #444; border-radius: 6px; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
                    <button style="display: block; width: 100%; padding: 8px; background: none; border: none; color: #fff; text-align: left; cursor: pointer;" onclick="copyAndClose('/skin url ${publicUrl}', this)">Plugin (/skin url)</button>
                    <button style="display: block; width: 100%; padding: 8px; background: none; border: none; color: #fff; text-align: left; cursor: pointer;" onclick="copyAndClose('/skin set web ${modelType} &quot;${publicUrl}&quot;', this)">Mod (/skin set web)</button>
                    <button style="display: block; width: 100%; padding: 8px; background: none; border: none; color: #fff; text-align: left; cursor: pointer;" onclick="copyAndClose('${publicUrl}', this)">Solo URL</button>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function toggleDropdown(dropdownId, event) {
    event.stopPropagation();
    
    // Cerrar cualquier otro desplegable abierto
    document.querySelectorAll('.copy-dropdown').forEach(d => {
        if (d.id !== dropdownId) d.style.display = 'none';
    });

    const dropdown = document.getElementById(dropdownId);
    dropdown.style.display = (dropdown.style.display === 'block') ? 'none' : 'block';
}

function copyAndClose(text, optionBtn, dropdownId) {
    // 1. Copiar al portapapeles
    navigator.clipboard.writeText(text).then(() => {
        const dropdown = document.getElementById(dropdownId);
        const parentGroup = dropdown.parentElement;
        const mainCopyBtn = parentGroup.querySelector('button');

        // 2. Cerrar el menú desplegable inmediatamente
        dropdown.style.display = 'none';

        // 3. Dar feedback visual en el botón principal
        const originalText = mainCopyBtn.textContent;
        mainCopyBtn.textContent = '¡Copiado! ✓';
        mainCopyBtn.style.background = 'var(--accent-amber, #ff9900)';
        mainCopyBtn.style.color = '#000';

        // 4. Restaurar el botón a su estado original a los 1.5 segundos
        setTimeout(() => {
            mainCopyBtn.textContent = originalText;
            mainCopyBtn.style.background = '';
            mainCopyBtn.style.color = '';
        }, 1500);
    }).catch(err => {
        console.error('Error al copiar: ', err);
    });
}

// Cierre automático al hacer clic en cualquier parte fuera del menú
document.addEventListener('click', () => {
    document.querySelectorAll('.copy-dropdown').forEach(d => d.style.display = 'none');
});

        setTimeout(() => {
            optionBtn.textContent = originalText;
            optionBtn.style.color = '#fff';
            optionBtn.parentElement.style.display = 'none';
        }, 800);
    });
}

// Cierre automático al hacer clic fuera
document.addEventListener('click', () => {
    document.querySelectorAll('.copy-dropdown').forEach(d => d.style.display = 'none');
});

function setupIntersectionObserver() {
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            const container = entry.target;
            const containerId = container.id;
            const skinUrl = container.dataset.skinUrl;
            const modelType = container.dataset.model;

            if (entry.isIntersecting) {
                if (!activeViewers.has(containerId)) {
                    try {
                        container.innerHTML = '';
                        const canvas = document.createElement('canvas');
                        container.appendChild(canvas);

                        const viewer = new skinview3d.SkinViewer({
                            canvas: canvas,
                            width: 180,
                            height: 220,
                            skin: skinUrl,
                            model: modelType
                        });
                        viewer.animation = new skinview3d.WalkingAnimation();
                        viewer.animation.speed = 0.5;
                        viewer.autoRotate = true;
                        viewer.autoRotateSpeed = 0.8;
                        
                        activeViewers.set(containerId, viewer);
                    } catch (e) {
                        console.error("Error WebGL:", containerId, e);
                    }
                }
            } else {
                if (activeViewers.has(containerId)) {
                    const viewer = activeViewers.get(containerId);
                    viewer.dispose();
                    activeViewers.delete(containerId);
                    container.innerHTML = '';
                }
            }
        });
    }, { rootMargin: '150px 0px' });

    document.querySelectorAll('.canvas-container').forEach(el => observer.observe(el));
}

initCatalog();
    </script>
</body>
</html>
